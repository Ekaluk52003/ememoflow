<div id="comment-{{ c.id }}" class="p-3 rounded-lg bg-gray-50 dark:bg-white/5">
    <div class="flex justify-between text-xs text-gray-500 dark:text-gray-400">
        <span class="font-semibold text-gray-700 dark:text-gray-200">{{ c.author.get_full_name|default:c.author.username }}</span>
        <span>{{ c.created_at|date:"d M Y H:i" }}
            {% if not c.is_deleted %}
            <button type="button" class="ml-2 text-neon-violet hover:underline" data-reply="{{ c.parent_id|default:c.id }}"
                data-name="{{ c.author.get_full_name|default:c.author.username }}"{% if c.parent_id and c.author_id != request.user.id %} data-mention="{{ c.author.username }}"{% endif %}>Reply</button>
            {% endif %}
            {% if c.author_id == request.user.id and not c.is_deleted %}
            <button type="button" class="ml-2 text-red-500 hover:underline"
                hx-post="{% url 'document_approval:delete_comment' c.id %}" hx-target="#comments-section" hx-swap="outerHTML"
                hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>Delete</button>
            {% endif %}
        </span>
    </div>
    {% if c.is_deleted %}
    <p class="mt-1 text-sm italic text-gray-400">This comment was removed.</p>
    {% else %}
    <p class="mt-1 text-sm text-gray-800 whitespace-pre-line dark:text-gray-100">{{ c.html }}</p>
    {% endif %}
</div>
